[package]
name = "p2pfiletransfer"
version = "0.3.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.54", features = [
    "tcp", "noise", "yamux", "mdns", "relay",
    "dcutr", "identify", "tokio", "macros",
] }
libp2p-stream = "0.2.0-alpha"
tokio = { version = "1", features = [
    "rt", "net", "io-util", "fs", "macros", "time", "signal",
] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
